name: Android build
on:
  workflow_dispatch:
    inputs:
      port:
        description: Game to build
        type: choice
        options: [OutRun2, HOTD3, VCop3, GhostSquad, MaximumTune1, MaximumTune2]
        default: OutRun2
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest   # standard runner: free on public repos
    timeout-minutes: 180
    defaults:
      run:
        working-directory: ports/${{ inputs.port }}
    env:
      ARCHIVE_URL: ${{ secrets.GAME_ARCHIVE_URL }}   # your own copy of the game .7z (repo secret)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build p7zip-full git zip curl \
            libvulkan-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev \
            libxss-dev libxtst-dev libxrender-dev libwayland-dev libxkbcommon-dev libasound2-dev libpulse-dev libdrm-dev libgbm-dev \
            libgl1-mesa-dev libudev-dev libdbus-1-dev
      - name: Android SDK / NDK
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          yes | "$ANDROID_SDK_ROOT"/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT"/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;36.0.0" "ndk;28.2.13676358"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "NDK=$ANDROID_SDK_ROOT/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - name: Apply aspect ratio patch
        run: |
          python3 - <<'PYEOF'
          import sys
          def edit(f, old, new):
              s = open(f).read()
              if old not in s:
                  sys.exit("patch anchor not found in " + f)
              open(f, "w").write(s.replace(old, new, 1))
          r = "sdk/runtime/"
          if "aspect_ratio" in open(r + "app/settings.cpp").read():
              print("aspect patch already present"); sys.exit(0)
          edit(r+"app/app.h", "    uint32_t aniso = 0; ", "    uint32_t aspect = 0;             // 0 auto, 1 4:3, 2 16:9, 3 stretch to screen\n    uint32_t aniso = 0; ")
          edit(r+"app/settings.cpp", '    s.aniso = t["anisotropic_filtering"].value_or(s.aniso);', '    s.aniso = t["anisotropic_filtering"].value_or(s.aniso);\n    s.aspect = t["aspect_ratio"].value_or(s.aspect);')
          edit(r+"app/settings.cpp", '                  {"anisotropic_filtering", int64_t(s.aniso)},', '                  {"anisotropic_filtering", int64_t(s.aniso)},\n                  {"aspect_ratio", int64_t(s.aspect)},')
          edit(r+"app/graphics_menu.cpp", "        const uint32_t filters[] = {0,2,4,8,16};", '        const uint32_t aspects[] = {0,1,2,3};\n        const char* const aspect_names[] = {"Auto", "4:3", "16:9", "Stretch (fill screen)"};\n        Choice("Aspect ratio",draft.aspect,aspects,aspect_names);\n        const uint32_t filters[] = {0,2,4,8,16};')
          edit(r+"app/graphics_menu.cpp", "s.render_percent=draft.render_percent; s.aniso=draft.aniso;", "s.render_percent=draft.render_percent; s.aniso=draft.aniso; s.aspect=draft.aspect;")
          edit(r+"gpu/vulkan_present.cpp", """    float aspect = app::Widescreen() ? 16.0f / 9.0f : 4.0f / 3.0f;
              float w = float(bb.desc.w);
              float h = float(bb.desc.h);
              float vw = std::min(w, h * aspect);
              float vh = vw / aspect;""", """    float w = float(bb.desc.w);
              float h = float(bb.desc.h);
              // The display is landscape. A surface pre-rotated by 90/270 degrees is turned by the compositor, so the
              // letterbox is worked out in display terms and then transposed into the buffer.
              uint32_t ww = 0, wh = 0;
              app::WindowPixels(ww, wh);
              const float S = (ww && wh) ? float(std::max(ww, wh)) / float(std::min(ww, wh))
                                         : std::max(w, h) / std::min(w, h);
              const auto xf = swap_ ? swap_->Transform() : VK_SURFACE_TRANSFORM_IDENTITY_BIT_KHR;
              const bool turned = xf == VK_SURFACE_TRANSFORM_ROTATE_90_BIT_KHR || xf == VK_SURFACE_TRANSFORM_ROTATE_270_BIT_KHR;
              const uint32_t am = app::Get().aspect;  // 0 auto, 1 4:3, 2 16:9, 3 stretch
              float aspect = am == 1 ? 4.0f / 3.0f : am == 2 ? 16.0f / 9.0f : am == 3 ? S
                           : (app::Widescreen() ? 16.0f / 9.0f : 4.0f / 3.0f);
              const float fx = std::min(1.0f, aspect / S), fy = std::min(1.0f, S / aspect);
              float vw = (turned ? fy : fx) * w;
              float vh = (turned ? fx : fy) * h;""")
          print("aspect patch applied")
          PYEOF
      - name: Add F9 aspect hotkey
        run: |
          python3 - <<'PYEOF'
          import sys
          f = "sdk/runtime/app/window_sdl.cpp"
          s = open(f).read()
          if "SDL_SCANCODE_F9" in s:
              print("F9 hotkey already present"); sys.exit(0)
          old = "    if (k.scancode == SDL_SCANCODE_F10) {\n        if (k.down && !k.repeat) ToggleGraphicsMenu();"
          new = "    if (k.scancode == SDL_SCANCODE_F9) {\n        if (k.down && !k.repeat) { Settings& st = Get(); st.aspect = (st.aspect + 1) % 4; Save(); }\n        return;\n    }\n" + old
          if old not in s: sys.exit("F9 anchor not found")
          open(f, "w").write(s.replace(old, new, 1))
          print("F9 aspect hotkey added")
          PYEOF
      - name: Fix touch aim for aspect modes
        run: |
          python3 - <<'PYEOF'
          import os, sys
          def edit(f, old, new):
              t = open(f).read()
              if old not in t:
                  print("::warning::anchor not found in " + f); return False
              open(f, "w").write(t.replace(old, new, 1)); return True
          if "PresentAspect" in open("sdk/runtime/app/app.h").read():
              print("aim fix already present"); sys.exit(0)
          edit("sdk/runtime/app/app.h", "bool Widescreen();", "bool Widescreen();\nfloat PresentAspect(float w, float h);  // the aspect the frame is presented at (Aspect ratio setting)")
          edit("sdk/runtime/app/settings.cpp", "float RenderScale(uint32_t guest_height) {",
          """float PresentAspect(float w, float h) {
              const uint32_t am = Get().aspect;
              if (am == 1) return 4.0f / 3.0f;
              if (am == 2) return 16.0f / 9.0f;
              if (am == 3 && w > 0 && h > 0) return w / h;
              return Widescreen() ? 16.0f / 9.0f : 4.0f / 3.0f;
          }

          float RenderScale(uint32_t guest_height) {""")
          mh = "src/game/mouse.h"
          if os.path.exists(mh):
              t = open(mh).read()
              old1 = "inline Aim MapMouse(float x, float y, float width, float height, bool wide) {"
              old2 = "    const float aspect = wide ? 16.0f / 9.0f : 4.0f / 3.0f;\n"
              end = "            u >= 0 && u < 1 && v >= 0 && v < 1};\n}\n"
              if old1 in t and old2 in t and end in t:
                  t = t.replace(old1, "inline Aim MapMouseAspect(float x, float y, float width, float height, float aspect) {", 1)
                  t = t.replace(old2, "", 1)
                  t = t.replace(end, end + "\ninline Aim MapMouse(float x, float y, float width, float height, bool wide) {\n    return MapMouseAspect(x, y, width, height, wide ? 16.0f / 9.0f : 4.0f / 3.0f);\n}\n", 1)
                  open(mh, "w").write(t)
                  old = "MapMouse(mouse.x, mouse.y, mouse.width, mouse.height, app::Widescreen())"
                  new = "MapMouseAspect(mouse.x, mouse.y, mouse.width, mouse.height, app::PresentAspect(mouse.width, mouse.height))"
                  for fn in os.listdir("src/game"):
                      fp = os.path.join("src/game", fn)
                      if fn.endswith((".cpp", ".h")):
                          c = open(fp).read()
                          if old in c:
                              open(fp, "w").write(c.replace(old, new)); print("aim mapping updated in " + fp)
              else:
                  print("::warning::mouse.h layout differs, touch aim not updated")
          print("aim fix applied")
          PYEOF
      - name: Apply HUD patch (icon, buttons, layout)
        working-directory: .
        env:
          PORT: ${{ inputs.port }}
        run: |
          ZIP=".github/workflows/$(echo "$PORT" | tr 'A-Z' 'a-z')_patch.zip"
          if [ -f "$ZIP" ]; then
            unzip -o "$ZIP" -d .
            rm -f "ports/$PORT/android/app/src/main/res/drawable/ic_launcher.xml"
            echo "HUD patch applied: $ZIP"
          else
            echo "::warning::$ZIP not found - building without HUD patch"
          fi
      - name: Fetch game archive
        run: |
          test -n "$ARCHIVE_URL" || { echo "Set repo secret GAME_ARCHIVE_URL"; exit 1; }
          NAME=$(python3 -c "import json;print(json.load(open('config/media.json'))['archive'])")
          if echo "$ARCHIVE_URL" | grep -q "drive.google.com"; then
            pip install gdown
            ID=$(echo "$ARCHIVE_URL" | sed -E 's#.*/d/([^/?]+).*#\1#')
            gdown "$ID" -O "/tmp/$NAME"
          else
            curl -fL --retry 3 "$ARCHIVE_URL" -o "/tmp/$NAME"
          fi
          python3 tools/prepare_game.py "/tmp/$NAME"
      - name: Generate native code
        run: python3 tools/build_native.py --generate-only --jobs 4
      - name: Build APK
        run: python3 tools/build_android.py --jobs 4
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.port }}-apk
          path: ports/${{ inputs.port }}/android/build/*.apk
